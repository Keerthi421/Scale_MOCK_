[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit: `alembic/` and `tests/` are top-level dirs but not part of the package.
packages = ["app"]

[project]
name = "interviewforge-api"
version = "0.1.0"
description = "InterviewForge — AI-powered SDE interview preparation platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.12",
    "redis>=5.2.0",
    "arq>=0.26.0",
    "anthropic>=0.40.0",
    "httpx>=0.28.0",
    "stripe>=11.3.0",
    "authlib>=1.3.2",
    "itsdangerous>=2.2.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "aiosqlite>=0.20.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = [
    "B008",  # FastAPI Depends() in argument defaults is idiomatic
    # `from sqlalchemy.dialects.postgresql import UUID as PgUUID` — the alias
    # disambiguates the column type from stdlib uuid.UUID, which we also use.
    "N811",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
